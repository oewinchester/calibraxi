[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calibraxi-data"
version = "0.1.0"
description = "CalibraXI data foundation contracts and source adapters"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
postgres = ["psycopg[binary]>=3.2,<4"]
storage = ["boto3>=1.35,<2"]
soccerdata = ["soccerdata>=1.9,<2"]
sofascore = ["wrapper-tls-requests>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
